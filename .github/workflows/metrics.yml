name: generate profile metrics

on:
  schedule:
    # daily at 00:30 UTC, half an hour after the snake
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Self-hosted stats. The popular third-party card services (github-readme-stats,
      # streak-stats, profile-trophy) are shared Vercel deployments that get paused or
      # rate-limited, which leaves dead images on your profile. This renders the SVGs
      # into this repo instead, so nothing at view time depends on someone else's uptime.
      #
      # secrets.METRICS_TOKEN is optional: a classic PAT with `read:user` (plus `repo`
      # if you want private contributions counted). Falls back to the job token.
      - name: Overview card
        # lowlighter/metrics v3.34
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Wandati26
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          # set this to your actual timezone so the calendar buckets days correctly
          config_timezone: Europe/Rome
          committer_branch: main
          committer_message: "chore(metrics): refresh overview card"

      - name: Language + calendar card
        # lowlighter/metrics v3.34
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Wandati26
          filename: assets/metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # set this to your actual timezone so the calendar buckets days correctly
          config_timezone: Europe/Rome
          committer_branch: main
          committer_message: "chore(metrics): refresh language card"
