<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Marvin Wandati - DevSecOps Engineer. Terminal console showing security hardening metrics.">
  <title>Marvin Wandati — DevSecOps Engineer</title>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b11"/>
      <stop offset="55%" stop-color="#0a1018"/>
      <stop offset="100%" stop-color="#060a0f"/>
    </linearGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#101c27" stroke-width="1"/>
    </pattern>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0"/>
      <stop offset="45%" stop-color="#3ddc84" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#5ef2a0" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ef2a0"/>
      <stop offset="48%" stop-color="#a8f0d0"/>
      <stop offset="100%" stop-color="#38d9e0"/>
    </linearGradient>

    <linearGradient id="sweepEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5ef2a0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect x="0" y="0" width="1200" height="380" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", "Consolas", "Liberation Mono", monospace; }
    .dim    { fill: #61758a; }
    .txt    { fill: #b6c6d6; }
    .ok     { fill: #3ddc84; }
    .amber  { fill: #f5b942; }
    .cyan   { fill: #38d9e0; }
    .red    { fill: #ff6b5f; }

    /* ---- typewriter reveal: clip-path inset is reliably animatable ---- */
    @keyframes type   { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink  { 0%,45% { opacity: 1; } 50%,95% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes scan   { 0% { transform: translateY(-120px); } 100% { transform: translateY(400px); } }
    @keyframes pulse  { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes drain{ 0%,8%  { transform: scaleX(1);   }
                        55%,100% { transform: scaleX(var(--end, 0.05)); } }
    @keyframes heal   { 0%,8%  { fill: #ff6b5f; }
                        55%,100% { fill: #3ddc84; } }
    @keyframes glowUp { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

    .line { animation: type 0.85s steps(38) both; }
    .l1 { animation-delay: 0.35s; } .l2 { animation-delay: 1.15s; }
    .l3 { animation-delay: 1.85s; } .l4 { animation-delay: 2.55s; }
    .l5 { animation-delay: 3.25s; } .l6 { animation-delay: 3.95s; }

    .cursor { animation: blink 1.05s steps(1) infinite; animation-delay: 4.8s; }
    .scanline { animation: scan 7.5s linear infinite; }

    .led { animation: pulse 1.9s ease-in-out infinite; }
    .led2 { animation-delay: 0.5s; } .led3 { animation-delay: 1s; } .led4 { animation-delay: 1.5s; }

    .bar {
      transform-box: fill-box; transform-origin: 0% 50%;
      animation: drain 6s cubic-bezier(.6,.05,.25,1) infinite alternate,
                 heal  6s cubic-bezier(.6,.05,.25,1) infinite alternate;
    }
    .b1 { --end: 0.020; animation-delay: 0.2s, 0.2s; }
    .b2 { --end: 0.010; animation-delay: 0.5s, 0.5s; }
    .b3 { --end: 0.080; animation-delay: 0.8s, 0.8s; }
    .b4 { --end: 0.020; animation-delay: 1.1s, 1.1s; }

    .panelIn { animation: fadeIn 0.9s ease-out both; animation-delay: 1.6s; }
    .nameIn  { animation: fadeIn 1.2s ease-out both; animation-delay: 4.4s; }
    .tagIn   { animation: type 1.5s steps(46) both; animation-delay: 5.2s; }
    .edgeGlow{ animation: glowUp 3.2s ease-in-out infinite; }
  </style>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="380" fill="url(#bgGrad)"/>
    <rect width="1200" height="380" fill="url(#grid)" opacity="0.55"/>

    <!-- window chrome -->
    <rect x="0" y="0" width="1200" height="34" fill="#0c141d"/>
    <circle cx="22" cy="17" r="5.5" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="5.5" fill="#ffbd2e"/>
    <circle cx="62" cy="17" r="5.5" fill="#27c93f"/>
    <text class="mono dim" x="88" y="21" font-size="12.5">wandati@secops: ~/platform — secure-delivery</text>
    <text class="mono dim" x="1000" y="21" font-size="11.5" letter-spacing="1">MILAN, IT</text>
    <g class="edgeGlow">
      <circle cx="1104" cy="17" r="3.5" fill="#3ddc84"/>
    </g>
    <text class="mono ok" x="1116" y="21" font-size="11.5" letter-spacing="1.4">LIVE</text>
    <line x1="0" y1="34" x2="1200" y2="34" stroke="#1d2b3a" stroke-width="1"/>

    <!-- ================= LEFT: boot log ================= -->
    <g class="mono" font-size="14.5">
      <g class="line l1">
        <text x="32" y="72" class="ok">wandati@secops</text><text x="152" y="72" class="dim">:</text><text x="160" y="72" class="cyan">~</text><text x="172" y="72" class="dim">$</text><text x="188" y="72" class="txt">./init --profile --verify-chain</text>
      </g>
      <g class="line l2">
        <text x="32" y="102" class="ok">[  OK  ]</text><text x="108" y="102" class="txt">identity</text><text x="196" y="102" class="dim">·············</text><text x="320" y="102" class="ok">verified</text>
      </g>
      <g class="line l3">
        <text x="32" y="132" class="ok">[  OK  ]</text><text x="108" y="132" class="txt">supply-chain</text><text x="228" y="132" class="dim">·········</text><text x="320" y="132" class="ok">SBOM + cosign attested</text>
      </g>
      <g class="line l4">
        <text x="32" y="162" class="ok">[  OK  ]</text><text x="108" y="162" class="txt">ci-credentials</text><text x="244" y="162" class="dim">·······</text><text x="320" y="162" class="ok">OIDC — zero static keys</text>
      </g>
      <g class="line l5">
        <text x="32" y="192" class="ok">[  OK  ]</text><text x="108" y="192" class="txt">infrastructure</text><text x="244" y="192" class="dim">·······</text><text x="320" y="192" class="ok">terraform · 3 envs · eu-west-1</text>
      </g>
      <g class="line l6">
        <text x="32" y="222" class="amber">[  ··  ]</text><text x="108" y="222" class="txt">threat-surface</text><text x="244" y="222" class="dim">·······</text><text x="320" y="222" class="amber">continuous scan</text>
      </g>
      <rect class="cursor" x="32" y="240" width="9" height="16" fill="#3ddc84"/>
    </g>

    <!-- ================= RIGHT: hardening metrics ================= -->
    <g class="panelIn">
      <rect x="656" y="52" width="516" height="196" rx="10" fill="#0a121b" stroke="#1d2b3a" stroke-width="1"/>
      <text class="mono cyan" x="676" y="76" font-size="13" letter-spacing="2.2">◢ HARDENING TELEMETRY</text>
      <line x1="676" y1="86" x2="1152" y2="86" stroke="#1d2b3a"/>

      <!-- row 1 -->
      <circle class="led" cx="682" cy="110" r="3.2" fill="#3ddc84"/>
      <text class="mono dim" x="696" y="114" font-size="12.5">CRITICAL CVEs</text>
      <rect x="856" y="104" width="180" height="8" rx="4" fill="#16222e"/>
      <rect class="bar b1" x="856" y="104" width="180" height="8" rx="4" fill="#ff6b5f"/>
      <text class="mono txt" x="1050" y="114" font-size="12.5">25 → <tspan class="ok">0</tspan></text>

      <!-- row 2 -->
      <circle class="led led2" cx="682" cy="146" r="3.2" fill="#3ddc84"/>
      <text class="mono dim" x="696" y="150" font-size="12.5">IMAGE FINDINGS</text>
      <rect x="856" y="140" width="180" height="8" rx="4" fill="#16222e"/>
      <rect class="bar b2" x="856" y="140" width="180" height="8" rx="4" fill="#ff6b5f"/>
      <text class="mono txt" x="1050" y="150" font-size="12.5">1014 → <tspan class="ok">9</tspan></text>

      <!-- row 3 -->
      <circle class="led led3" cx="682" cy="182" r="3.2" fill="#3ddc84"/>
      <text class="mono dim" x="696" y="186" font-size="12.5">IMAGE SIZE</text>
      <rect x="856" y="176" width="180" height="8" rx="4" fill="#16222e"/>
      <rect class="bar b3" x="856" y="176" width="180" height="8" rx="4" fill="#ff6b5f"/>
      <text class="mono txt" x="1050" y="186" font-size="12.5">2.5G → <tspan class="ok">200M</tspan></text>

      <!-- row 4 -->
      <circle class="led led4" cx="682" cy="218" r="3.2" fill="#3ddc84"/>
      <text class="mono dim" x="696" y="222" font-size="12.5">LONG-LIVED KEYS</text>
      <rect x="856" y="212" width="180" height="8" rx="4" fill="#16222e"/>
      <rect class="bar b4" x="856" y="212" width="180" height="8" rx="4" fill="#ff6b5f"/>
      <text class="mono txt" x="1050" y="222" font-size="12.5">100% → <tspan class="ok">0</tspan></text>
    </g>

    <!-- divider -->
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#152230" stroke-width="1"/>
    <rect x="0" y="269" width="1200" height="2" fill="url(#sweepEdge)" class="edgeGlow"/>

    <!-- ================= NAME BLOCK ================= -->
    <g class="nameIn">
      <text class="mono" x="32" y="322" font-size="40" font-weight="700"
            letter-spacing="5" fill="url(#nameGrad)" filter="url(#glowSoft)">MARVIN WANDATI</text>
    </g>
    <g class="tagIn">
      <text class="mono txt" x="34" y="354" font-size="14.5" letter-spacing="0.6">DevSecOps Engineer<tspan class="dim">  ·  </tspan>AWS<tspan class="dim">  ·  </tspan>Kubernetes<tspan class="dim">  ·  </tspan>Terraform<tspan class="dim">  ·  </tspan>Software Supply-Chain Security<tspan class="dim">  ·  </tspan>Observability</text>
    </g>

    <!-- scanline -->
    <rect class="scanline" x="0" y="0" width="1200" height="110" fill="url(#scanGrad)"/>

    <!-- frame -->
    <rect x="0.5" y="0.5" width="1199" height="379" rx="14" fill="none" stroke="#233544" stroke-width="1"/>
  </g>
</svg>
