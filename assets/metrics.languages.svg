<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" width="960" height="180" role="img" aria-label="Language and contribution calendar card — pending first workflow run.">
  <title>Languages and calendar — pending generation</title>
  <defs>
    <linearGradient id="lBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b11"/><stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <clipPath id="lClip"><rect width="960" height="180" rx="12"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", "Consolas", monospace; }
    @keyframes bl { 0%,45% { opacity:1 } 50%,95% { opacity:0 } 100% { opacity:1 } }
    @keyframes sh { 0% { transform: translateX(-240px) } 100% { transform: translateX(960px) } }
    .cur { animation: bl 1.05s steps(1) infinite; }
    .shim{ animation: sh 2.6s linear infinite; }
  </style>
  <g clip-path="url(#lClip)">
    <rect width="960" height="180" fill="url(#lBg)"/>
    <text class="mono" x="32" y="62" font-size="12.5" fill="#38d9e0" letter-spacing="2.2">◢ LANGUAGES + CALENDAR</text>
    <text class="mono" x="32" y="96" font-size="14" fill="#b6c6d6">generated by .github/workflows/metrics.yml — awaiting first run</text>
    <text class="mono" x="32" y="122" font-size="11.5" fill="#61758a">set a METRICS_TOKEN secret for richer output; falls back to the job token</text>
    <rect class="cur" x="32" y="136" width="9" height="15" fill="#3ddc84"/>
    <rect class="shim" x="0" y="0" width="240" height="180" fill="#3ddc84" opacity="0.05"/>
    <rect x="0.5" y="0.5" width="959" height="179" rx="12" fill="none" stroke="#233544"/>
  </g>
</svg>
