<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Animated secure delivery pipeline: commit through SAST, secret scanning, dependency review, image scanning, SBOM, cosign signing and verified deploy. Unsigned images are blocked.">
  <title>Secure delivery pipeline — six gates, signed artifacts only</title>

  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b11"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <pattern id="pGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0f1a24" stroke-width="1"/>
    </pattern>
    <filter id="pGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="packetGrad">
      <stop offset="0%" stop-color="#d7fff0"/>
      <stop offset="45%" stop-color="#5ef2a0"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pClip"><rect width="1200" height="300" rx="12"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", "Consolas", "Liberation Mono", monospace; }
    .dim { fill: #61758a; } .txt { fill: #b6c6d6; } .ok { fill: #3ddc84; }
    .cyan { fill: #38d9e0; } .red { fill: #ff6b5f; } .amber { fill: #f5b942; }

    @keyframes dashflow { to { stroke-dashoffset: -36; } }
    @keyframes travel   { 0% { transform: translateX(0); }
                          80% { transform: translateX(1050px); }
                          100% { transform: translateX(1050px); } }
    @keyframes trail    { 0% { stroke-dashoffset: 1050; }
                          80%,100% { stroke-dashoffset: 0; } }
    @keyframes lit      { 0%, 100%  { stroke: #22303e; }
                          5%        { stroke: #9dffd0; }
                          12%, 96%  { stroke: #3ddc84; } }
    @keyframes litFill  { 0%, 100%  { fill: #0b131c; }
                          5%        { fill: #14301f; }
                          12%, 96%  { fill: #0e2117; } }
    @keyframes check    { 0%, 3%   { opacity: 0; }
                          9%        { opacity: 1; }
                          12%, 95%  { opacity: 1; }
                          100%      { opacity: 0; } }
    @keyframes labelLit { 0%, 100% { fill: #7d90a3; } 10%, 95% { fill: #3ddc84; } }
    @keyframes rejTravel{ 0%, 8%   { transform: translateX(0); opacity: 0; }
                          14%       { opacity: 1; }
                          52%       { transform: translateX(700px); opacity: 1; }
                          60%,100%  { transform: translateX(700px); opacity: 0.15; } }
    @keyframes rejX     { 0%, 52%  { opacity: 0; transform: scale(0.5); }
                          58%       { opacity: 1; transform: scale(1.2); }
                          64%, 92%  { opacity: 1; transform: scale(1); }
                          100%      { opacity: 0; transform: scale(0.5); } }
    @keyframes shake    { 0%,100% { transform: translateX(0); }
                          25% { transform: translateX(-3px); }
                          75% { transform: translateX(3px); } }
    @keyframes fadePulse{ 0%,100% { opacity: .45; } 50% { opacity: 1; } }

    .flow  { stroke-dasharray: 6 12; animation: dashflow 1.1s linear infinite; }
    .trailLine { stroke-dasharray: 1050; animation: trail 10s cubic-bezier(.42,0,.58,1) infinite; }
    .packet { animation: travel 10s cubic-bezier(.42,0,.58,1) infinite; }

    .node { animation: lit 10s linear infinite, litFill 10s linear infinite; }
    .chk  { animation: check 10s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .lbl  { animation: labelLit 10s linear infinite; }

    .n0 { animation-delay: 0.00s, 0.00s; } .n1 { animation-delay: 1.14s, 1.14s; }
    .n2 { animation-delay: 2.28s, 2.28s; } .n3 { animation-delay: 3.42s, 3.42s; }
    .n4 { animation-delay: 4.56s, 4.56s; } .n5 { animation-delay: 5.70s, 5.70s; }
    .n6 { animation-delay: 6.84s, 6.84s; } .n7 { animation-delay: 8.00s, 8.00s; }

    .c0 { animation-delay: 0.00s; } .c1 { animation-delay: 1.14s; }
    .c2 { animation-delay: 2.28s; } .c3 { animation-delay: 3.42s; }
    .c4 { animation-delay: 4.56s; } .c5 { animation-delay: 5.70s; }
    .c6 { animation-delay: 6.84s; } .c7 { animation-delay: 8.00s; }

    .rejPkt { animation: rejTravel 10s ease-in-out infinite; }
    .rejMark{ animation: rejX 10s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .rejTxt { animation: rejX 10s ease-in-out infinite, shake 0.35s ease-in-out 3; animation-delay: 0s, 5.8s; }
    .breathe{ animation: fadePulse 3s ease-in-out infinite; }
  </style>

  <g clip-path="url(#pClip)">
    <rect width="1200" height="300" fill="url(#pBg)"/>
    <rect width="1200" height="300" fill="url(#pGrid)" opacity="0.6"/>

    <text class="mono cyan" x="28" y="34" font-size="14" letter-spacing="2.4">◢ SECURE DELIVERY PIPELINE</text>
    <text class="mono dim" x="28" y="54" font-size="12.5">six gates · signed artifacts only · dev → staging → prod with required approvals</text>
    <line x1="28" y1="68" x2="1172" y2="68" stroke="#152230"/>

    <!-- ============ main track ============ -->
    <line x1="75" y1="140" x2="1125" y2="140" stroke="#1b2836" stroke-width="2"/>
    <line class="flow" x1="75" y1="140" x2="1125" y2="140" stroke="#243546" stroke-width="2"/>
    <line class="trailLine" x1="75" y1="140" x2="1125" y2="140" stroke="#3ddc84" stroke-width="2.2" opacity="0.75"/>

    <!-- traveling packet -->
    <g class="packet">
      <g transform="translate(75,140)">
        <circle r="16" fill="url(#packetGrad)" opacity="0.55"/>
        <circle r="5.5" fill="#d7fff0" filter="url(#pGlow)"/>
      </g>
    </g>

    <!-- ============ nodes ============ -->
    <!-- 0 COMMIT -->
    <g>
      <rect class="node n0" x="53" y="118" width="44" height="44" rx="10" fill="#0b131c" stroke="#22303e" stroke-width="1.6"/>
      <!-- commit glyph drawn as paths — no font dependency -->
      <g class="chk c0" transform="translate(75,140)" fill="none" stroke="#3ddc84" stroke-width="1.8" stroke-linecap="round">
        <line x1="-9" y1="0" x2="-4" y2="0"/><line x1="4" y1="0" x2="9" y2="0"/>
        <circle cx="0" cy="0" r="4" fill="#0e2117"/>
      </g>
      <text class="mono lbl n0" x="75" y="192" font-size="13" text-anchor="middle" letter-spacing="1">COMMIT</text>
    </g>
    <!-- 1 SAST -->
    <g>
      <rect class="node n1" x="203" y="118" width="44" height="44" rx="10" fill="#0b131c" stroke="#22303e" stroke-width="1.6"/>
      <text class="mono ok chk c1" x="225" y="147" font-size="16" text-anchor="middle">✓</text>
      <text class="mono lbl n1" x="225" y="192" font-size="13" text-anchor="middle" letter-spacing="1">SAST</text>
    </g>
    <!-- 2 SECRETS -->
    <g>
      <rect class="node n2" x="353" y="118" width="44" height="44" rx="10" fill="#0b131c" stroke="#22303e" stroke-width="1.6"/>
      <text class="mono ok chk c2" x="375" y="147" font-size="16" text-anchor="middle">✓</text>
      <text class="mono lbl n2" x="375" y="192" font-size="13" text-anchor="middle" letter-spacing="1">SECRETS</text>
    </g>
    <!-- 3 DEPS -->
    <g>
      <rect class="node n3" x="503" y="118" width="44" height="44" rx="10" fill="#0b131c" stroke="#22303e" stroke-width="1.6"/>
      <text class="mono ok chk c3" x="525" y="147" font-size="16" text-anchor="middle">✓</text>
      <text class="mono lbl n3" x="525" y="192" font-size="13" text-anchor="middle" letter-spacing="1">DEPS</text>
    </g>
    <!-- 4 IMAGE SCAN -->
    <g>
      <rect class="node n4" x="653" y="118" width="44" height="44" rx="10" fill="#0b131c" stroke="#22303e" stroke-width="1.6"/>
      <text class="mono ok chk c4" x="675" y="147" font-size="16" text-anchor="middle">✓</text>
      <text class="mono lbl n4" x="675" y="192" font-size="13" text-anchor="middle" letter-spacing="1">IMAGE SCAN</text>
    </g>
    <!-- 5 SBOM -->
    <g>
      <rect class="node n5" x="803" y="118" width="44" height="44" rx="10" fill="#0b131c" stroke="#22303e" stroke-width="1.6"/>
      <text class="mono ok chk c5" x="825" y="147" font-size="16" text-anchor="middle">✓</text>
      <text class="mono lbl n5" x="825" y="192" font-size="13" text-anchor="middle" letter-spacing="1">SBOM</text>
    </g>
    <!-- 6 COSIGN -->
    <g>
      <rect class="node n6" x="953" y="118" width="44" height="44" rx="10" fill="#0b131c" stroke="#22303e" stroke-width="1.6"/>
      <!-- signing padlock drawn as paths — no font dependency -->
      <g class="chk c6" transform="translate(975,140)">
        <path d="M-4.2 -2 V-5.2 a4.2 4.2 0 0 1 8.4 0 V-2" fill="none" stroke="#3ddc84" stroke-width="1.7" stroke-linecap="round"/>
        <rect x="-7" y="-2" width="14" height="11" rx="2.2" fill="#0e2117" stroke="#3ddc84" stroke-width="1.5"/>
        <circle cx="0" cy="3.5" r="1.5" fill="#3ddc84"/>
      </g>
      <text class="mono lbl n6" x="975" y="192" font-size="13" text-anchor="middle" letter-spacing="1">COSIGN SIGN</text>
    </g>
    <!-- 7 DEPLOY -->
    <g>
      <rect class="node n7" x="1103" y="118" width="44" height="44" rx="10" fill="#0b131c" stroke="#22303e" stroke-width="1.6"/>
      <text class="mono ok chk c7" x="1125" y="147" font-size="16" text-anchor="middle">▲</text>
      <text class="mono lbl n7" x="1125" y="192" font-size="13" text-anchor="middle" letter-spacing="1">DEPLOY</text>
    </g>

    <!-- ============ rejection lane ============ -->
    <line x1="75" y1="248" x2="800" y2="248" stroke="#1b2836" stroke-width="1.4" stroke-dasharray="4 6"/>
    <text class="mono dim" x="28" y="232" font-size="12" letter-spacing="1.4">ADMISSION</text>

    <g class="rejPkt">
      <g transform="translate(75,248)">
        <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#2a1518" stroke="#ff6b5f" stroke-width="1.4"/>
      </g>
    </g>

    <!-- gate barrier -->
    <line class="breathe" x1="800" y1="222" x2="800" y2="274" stroke="#ff6b5f" stroke-width="2"/>
    <!-- static translate on the OUTER g; the animated inner g carries no transform
         attribute, because a CSS transform animation would override it. -->
    <g transform="translate(800,248)">
      <g class="rejMark">
        <circle r="13" fill="#1c0f12" stroke="#ff6b5f" stroke-width="1.6"/>
        <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#ff6b5f" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    <g class="rejTxt">
      <text class="mono red" x="826" y="245" font-size="14" letter-spacing="0.8">UNSIGNED IMAGE — BLOCKED</text>
      <text class="mono dim" x="826" y="262" font-size="12">cosign verification is mandatory before prod</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="none" stroke="#233544"/>
  </g>
</svg>
